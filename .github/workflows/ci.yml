name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  database:
    name: Database migrations & permission tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and RLS tests on a throwaway Postgres
        run: PG_BIN=$(ls -d /usr/lib/postgresql/*/bin | tail -1) supabase/tests/local/run.sh
