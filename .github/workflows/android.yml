name: Android app

# Builds the Android app (APK) on GitHub's machines and publishes it at a
# fixed link:
#   https://github.com/Ahmadbaba46/BuaFamily/releases/latest/download/bua-family.apk
#
# Runs when the app changes on master, or by hand (Actions → Android app →
# Run workflow).
#
# Signing: with the four ANDROID_* repository secrets set (see README,
# "Android app"), every build is signed with the family's own key, so phones
# update in place. Without them it is signed with a throwaway test key.
#
# With the family key it also builds the Google Play app bundle
# (bua-family-play.aab, under the run's Artifacts) to upload in Play Console.

on:
  push:
    branches: [master]
    paths: ['app/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

env:
  # Public values (the same ones the website uses); repository variables win if set.
  SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://dhvbhnmtiecejmgwhnac.supabase.co' }}
  SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_QTeiajwPCnJnt7ud-mGr_Q_ruyUHySp' }}

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the build number can count commits.
          fetch-depth: 0
      # The build number is the number of commits, as on a Windows build
      # (app/tool/build_android.ps1): the same commit always gets the same
      # number, and it grows with every change, as Play requires.
      - name: Build number
        run: echo "BUILD=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" > android/key.properties
            echo "signed=family" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: signing with a test key. Phones will need to uninstall it before installing a properly signed build."
            echo "signed=test" >> "$GITHUB_OUTPUT"
          fi

      - run: flutter pub get
      - name: Build
        run: |
          flutter build apk --release \
            --build-name=1.0.${{ env.BUILD }} --build-number=${{ env.BUILD }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk bua-family.apk
          # Smaller files, one per phone type (each under Supabase's 50 MB limit,
          # for Admin > Settings > Android app > Publish).
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 \
            --build-name=1.0.${{ env.BUILD }} --build-number=${{ env.BUILD }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk bua-family-1.0.${{ env.BUILD }}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk bua-family-1.0.${{ env.BUILD }}-arm32.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: bua-family-1.0.${{ env.BUILD }}
          path: app/*.apk

      # The Google Play build: an app bundle, signed with the family key (Play's
      # upload key). It updates from Play rather than from a downloaded file.
      - name: Build for Google Play
        if: steps.signing.outputs.signed == 'family'
        run: |
          flutter build appbundle --release \
            --build-name=1.0.${{ env.BUILD }} --build-number=${{ env.BUILD }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=PLAY_STORE=true
          cp build/app/outputs/bundle/release/app-release.aab bua-family-play.aab

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.signed == 'family'
        with:
          name: bua-family-play-1.0.${{ env.BUILD }}
          path: app/bua-family-play.aab

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ env.BUILD }}
          name: Bua Family for Android 1.0.${{ env.BUILD }}
          make_latest: true
          prerelease: ${{ steps.signing.outputs.signed != 'family' }}
          body: |
            Install on Android: download **bua-family.apk** below on the phone, open it, and allow installing from this source if asked.
            To publish in the app (Admin > Settings > Android app), use the two smaller files: the **-arm64** one (most phones) and the **-arm32** one (older phones).
            ${{ steps.signing.outputs.signed == 'family' && 'Signed with the family key: it updates the app in place.' || 'Test build (signed with a temporary key). If you installed an earlier test build and this one will not install, uninstall the old one first.' }}
          files: |
            app/bua-family.apk
            app/bua-family-1.0.${{ env.BUILD }}-arm64.apk
            app/bua-family-1.0.${{ env.BUILD }}-arm32.apk
